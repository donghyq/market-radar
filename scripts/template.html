<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Radar — 产品立项与市场信号投研终端</title>
<style>
  :root {
    --bg: #0b0d11;
    --surface: #11141b;
    --panel: #161a23;
    --border: #222734;
    --border-focus: #3b82f6;
    --text: #f3f4f6;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;
    --accent: #3b82f6;
    --accent-dim: rgba(59, 130, 246, 0.12);
    --pos: #10b981;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 1380px; margin: 0 auto; padding: 28px 36px 60px; }
  /* Topbar */
  .topbar {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 20px;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.2px; color: var(--text); }
  .brand span { font-size: 12.5px; color: var(--text-muted); }
  .meta-right { font-size: 12px; color: var(--text-muted); display: flex; gap: 20px; }
  .meta-right b { color: var(--text-secondary); font-weight: 500; }

  /* Navigation & KPI strip */
  .subbar {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    margin-bottom: 22px;
  }
  .nav { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
  .nav-btn {
    background: transparent; color: var(--text-secondary); border: none;
    padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s;
  }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.4); border: 1px solid var(--border); }
  .metrics-inline { display: flex; gap: 24px; font-size: 12.5px; color: var(--text-muted); }
  .metrics-inline strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 4px; }

  /* Tables */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
  th { background: #0e1117; color: var(--text-muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; }
  tr.row-item { cursor: pointer; transition: background 0.12s; }
  tr.row-item:hover { background: rgba(255,255,255,0.02); }
  tr.row-item.selected { background: var(--accent-dim); }
  tr.row-item.selected td:first-child { border-left: 3px solid var(--accent); }

  /* Pills & Badges (monochrome + subtle accent) */
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11.5px; font-weight: 500;
    background: var(--panel); color: var(--text-secondary); border: 1px solid var(--border);
  }
  .pill-s { color: #93c5fd; border-color: rgba(59,130,246,0.35); background: rgba(59,130,246,0.1); }
  .num-score { font-size: 15px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

  /* Detail Inspector */
  .inspector {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px 28px; margin-bottom: 24px;
  }
  .ins-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
    border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px;
  }
  .ins-title { margin: 6px 0 0; font-size: 18px; font-weight: 600; color: var(--text); }
  .ins-score-box { text-align: right; min-width: 220px; }
  .ins-score-big { font-size: 26px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; }
  .ins-score-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; }

  .sec-label {
    font-size: 11.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 10px; display: block;
  }
  .summary-lead {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 16px; color: var(--text); margin-bottom: 20px; font-size: 13.8px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .card-cell {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px;
  }
  .cell-k { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block; }
  .cell-v { color: var(--text-secondary); font-size: 13px; }
  .step-row { display: flex; gap: 10px; margin-bottom: 8px; color: var(--text-secondary); }
  .step-no { color: var(--text-muted); font-family: monospace; font-size: 12px; min-width: 20px; }

  .btn {
    background: var(--panel); color: var(--text-secondary); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.12s;
  }
  .btn:hover { color: var(--text); border-color: var(--text-secondary); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
  .btn-primary:hover { opacity: 0.92; color: #fff; border-color: var(--accent); }

  /* Form controls */
  input, select, textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 6px; font-size: 13px; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .field-lbl { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }

  /* Modal */
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; max-width: 680px; width: 100%; padding: 24px; }
  .modal-pre { background: var(--bg); padding: 14px; border-radius: 6px; border: 1px solid var(--border); white-space: pre-wrap; font-size: 13px; color: var(--text-secondary); margin: 14px 0; max-height: 380px; overflow-y: auto; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--bg); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-secondary); }
</style>
<link rel="stylesheet" href="scripts/workstation.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 12l7-7"/></svg></span>
      <h1>Market Radar</h1>
      <span class="brand-caption">市场机会研究</span>
    </div>
    <div class="meta-right">
      <span>更新于 <b id="lblUpdated"></b></span>
      <span>归档批次 <b id="lblBatches"></b></span>
    </div>
  </header>

  <div class="subbar">
    <nav class="nav" aria-label="主导航">
      <button class="nav-btn active" aria-current="page" onclick="switchTab('tab-projects', this)">研究工作台</button>
      <button class="nav-btn" onclick="switchTab('tab-signals', this)">信号库 <span id="lblSigCnt">0</span></button>
      <button class="nav-btn" onclick="switchTab('tab-submit', this)">录入方向</button>
      <button class="nav-btn" onclick="switchTab('tab-whitepaper', this)">数据方法</button>
      <button class="nav-btn" onclick="switchTab('tab-roadmap', this)">归档与演进</button>
    </nav>
  </div>

  <div id="tab-projects"></div>
  <div id="tab-signals" style="display:none;"></div>
  <div id="tab-submit" style="display:none;"></div>
  <div id="tab-whitepaper" style="display:none;"></div>
  <div id="tab-roadmap" style="display:none;"></div>
</div>

<dialog class="modal-mask" id="snapModal" aria-labelledby="mTitle" onclick="if(event.target===this)this.close()">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
      <strong id="mTitle" style="font-size:15px;">证据快照</strong>
      <form method="dialog"><button class="btn">关闭</button></form>
    </div>
    <div id="mMeta" style="font-size:12px;color:var(--text-muted);margin-top:6px;"></div>
    <div class="modal-pre" id="mBody"></div>
    <div class="modal-links">
      <span id="mHint" style="color:var(--text-muted);"></span>
      <a id="mLink" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:none;"></a>
    </div>
  </div>
</dialog>

<script>
const DATA = __RADAR_DATA_JSON__;
</script>
<script src="scripts/dashboard_app.js"></script>
<script src="scripts/research_workstation.js"></script>
</body>
</html>
