<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Radar — 产品立项与市场信号投研终端</title>
<style>
  :root {
    --bg: #0b0d11;
    --surface: #11141b;
    --panel: #161a23;
    --border: #222734;
    --border-focus: #3b82f6;
    --text: #f3f4f6;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;
    --accent: #3b82f6;
    --accent-dim: rgba(59, 130, 246, 0.12);
    --pos: #10b981;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 1380px; margin: 0 auto; padding: 28px 36px 60px; }
  /* Topbar */
  .topbar {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 20px;
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.2px; color: var(--text); }
  .brand span { font-size: 12.5px; color: var(--text-muted); }
  .meta-right { font-size: 12px; color: var(--text-muted); display: flex; gap: 20px; }
  .meta-right b { color: var(--text-secondary); font-weight: 500; }

  /* Navigation & KPI strip */
  .subbar {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    margin-bottom: 22px;
  }
  .nav { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
  .nav-btn {
    background: transparent; color: var(--text-secondary); border: none;
    padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s;
  }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.4); border: 1px solid var(--border); }
  .metrics-inline { display: flex; gap: 24px; font-size: 12.5px; color: var(--text-muted); }
  .metrics-inline strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 4px; }

  /* Tables */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
  th { background: #0e1117; color: var(--text-muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; }
  tr.row-item { cursor: pointer; transition: background 0.12s; }
  tr.row-item:hover { background: rgba(255,255,255,0.02); }
  tr.row-item.selected { background: var(--accent-dim); }
  tr.row-item.selected td:first-child { border-left: 3px solid var(--accent); }

  /* Pills & Badges (monochrome + subtle accent) */
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11.5px; font-weight: 500;
    background: var(--panel); color: var(--text-secondary); border: 1px solid var(--border);
  }
  .pill-s { color: #93c5fd; border-color: rgba(59,130,246,0.35); background: rgba(59,130,246,0.1); }
  .num-score { font-size: 15px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

  /* Detail Inspector */
  .inspector {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px 28px; margin-bottom: 24px;
  }
  .ins-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
    border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px;
  }
  .ins-title { margin: 6px 0 0; font-size: 18px; font-weight: 600; color: var(--text); }
  .ins-score-box { text-align: right; min-width: 220px; }
  .ins-score-big { font-size: 26px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; }
  .ins-score-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; }

  .sec-label {
    font-size: 11.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 10px; display: block;
  }
  .summary-lead {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 16px; color: var(--text); margin-bottom: 20px; font-size: 13.8px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .card-cell {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px;
  }
  .cell-k { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block; }
  .cell-v { color: var(--text-secondary); font-size: 13px; }
  .step-row { display: flex; gap: 10px; margin-bottom: 8px; color: var(--text-secondary); }
  .step-no { color: var(--text-muted); font-family: monospace; font-size: 12px; min-width: 20px; }

  .btn {
    background: var(--panel); color: var(--text-secondary); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.12s;
  }
  .btn:hover { color: var(--text); border-color: var(--text-secondary); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
  .btn-primary:hover { opacity: 0.92; color: #fff; border-color: var(--accent); }

  /* Form controls */
  input, select, textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 6px; font-size: 13px; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .field-lbl { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }

  /* Modal */
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; max-width: 680px; width: 100%; padding: 24px; }
  .modal-pre { background: var(--bg); padding: 14px; border-radius: 6px; border: 1px solid var(--border); white-space: pre-wrap; font-size: 13px; color: var(--text-secondary); margin: 14px 0; max-height: 380px; overflow-y: auto; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--bg); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-secondary); }
</style>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1017;
  --surface: #111923;
  --panel: #16212d;
  --border: #263443;
  --text: #e9eff7;
  --text-secondary: #b8c6d6;
  --text-muted: #99aabd;
  --accent: #75c6f2;
  --accent-dim: #172b3d;
  --pos: #81d1bd;
  --gold: #efc285;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.shell { max-width: 1560px; padding: 18px clamp(16px, 3vw, 42px) 48px; }
.topbar { align-items: center; gap: 12px; padding-bottom: 14px; margin-bottom: 0; }
.brand { align-items: center; gap: 10px; }
.brand h1 { white-space: nowrap; letter-spacing: -.35px; }
.brand .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; background: #2b261f; border: 1px solid #4b3c2d; border-radius: 7px; color: var(--gold); }
.brand-mark svg { width: 21px; height: 21px; stroke: currentColor; stroke-width: 1.2; }
.brand-caption { border-left: 1px solid var(--border); padding-left: 10px; }
.meta-right { align-items: center; gap: 16px; flex-wrap: wrap; }
.meta-right b { font: 11px var(--mono); }
.batch-stamp { border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; }
.subbar { margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.nav { display: flex; flex-wrap: wrap; gap: 4px; border: 0; border-radius: 0; background: transparent; padding: 0; }
.nav-btn { border: 1px solid transparent; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 12px; font-size: 13px; }
.nav-btn.active { border: 1px solid transparent; border-bottom: 2px solid var(--gold); background: transparent; box-shadow: none; color: var(--gold); }
#lblSigCnt { font: 11px var(--mono); color: var(--text-muted); margin-left: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { color: #08131c; font-weight: 650; }
.btn-primary:hover { color: #08131c; }
.btn[aria-pressed="true"] { background: var(--accent-dim); border-color: #4e7897; color: var(--text); }
.research-heading { display: flex; justify-content: space-between; align-items: end; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.section-kicker { display: block; color: var(--gold); font: 600 11px/1.4 var(--mono); letter-spacing: .12em; }
.research-heading h2 { margin: 3px 0 2px; font-size: clamp(23px, 2.3vw, 32px); line-height: 1.2; font-weight: 630; letter-spacing: -.045em; }
.research-heading p { margin: 0; color: var(--text-muted); font-size: 13px; }
.mode-select { display: flex; gap: 4px; padding: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; }
.mode-select .btn { padding: 5px 11px; background: transparent; border-color: transparent; white-space: nowrap; }
.mode-select .btn[aria-pressed="true"] { background: var(--accent-dim); border-color: #4e7897; }
.research-stats { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
.research-stats > div { background: var(--surface); display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 0 8px; padding: 10px 15px; align-items: center; }
.research-stats span { color: var(--text-secondary); font-size: 12px; }
.research-stats strong { grid-row: span 2; font: 600 22px/1 var(--mono); color: var(--text); }
.research-stats small, .watch-sort, .panel-count { color: var(--text-muted); font-size: 11.5px; }
.research-desk { display: grid; grid-template-columns: minmax(200px, .95fr) minmax(0, 4fr); gap: 12px; align-items: start; }
.research-selection { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(254px, 1fr); gap: 12px; min-width: 0; }
.research-main, .research-context { display: grid; gap: 12px; align-content: start; min-width: 0; }
.desk-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; min-width: 0; }
.panel-head { min-height: 41px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 13px; border-bottom: 1px solid var(--border); }
.panel-head h3 { margin: 0; font-size: 13px; white-space: nowrap; font-weight: 650; }
.panel-count { text-align: right; }
.watch-sort { margin: 7px 12px 4px; }
#watchList { padding: 0 6px 6px; }
.watch-item { font: inherit; cursor: pointer; text-align: left; width: 100%; display: grid; grid-template-columns: 22px minmax(0,1fr) 25px; gap: 6px; align-items: start; color: var(--text); border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 8px 6px; }
.watch-item:hover { background: var(--panel); }
.watch-item[aria-pressed="true"] { background: var(--accent-dim); border-color: #38617b; }
.watch-rank, .watch-score, .asset-code, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.watch-rank { color: var(--text-muted); font-size: 11px; padding-top: 2px; }
.watch-score { text-align: right; font-size: 13px; }
.watch-item[aria-pressed="true"] .watch-score { color: var(--accent); }
.watch-label strong { display: block; font-size: 12.5px; font-weight: 550; line-height: 1.44; overflow-wrap: anywhere; }
.watch-label small { display: block; color: var(--text-muted); font-size: 11px; margin-top: 2px; }
.project-brief { padding: 15px 17px; }
.brief-eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--text-muted); font-size: 11.5px; }
.asset-code { color: var(--accent); background: var(--accent-dim); padding: 2px 6px; border-radius: 3px; }
.project-brief h3 { font-size: clamp(20px, 2.1vw, 28px); letter-spacing: -.025em; margin: 6px 0 7px; line-height: 1.28; font-weight: 640; overflow-wrap: anywhere; }
.brief-lead, .brief-buyer p, .validation-body p { margin: 0; color: var(--text-secondary); overflow-wrap: anywhere; }
.brief-buyer { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 9px; }
.brief-buyer span, .evidence-meta { color: var(--text-muted); font-size: 11.5px; }
.evidence-item { font: inherit; background: transparent; text-align: left; border: 0; border-bottom: 1px solid var(--border); width: 100%; cursor: pointer; color: var(--text); display: grid; gap: 1px; padding: 7px 31px 7px 13px; position: relative; }
.evidence-item:hover { background: var(--panel); }
.evidence-item strong { font-size: 12.5px; font-weight: 550; overflow-wrap: anywhere; }
.evidence-item small { color: var(--text-muted); font-size: 11.5px; overflow-wrap: anywhere; }
.evidence-arrow { position: absolute; top: 12px; right: 13px; color: var(--accent); }
.evidence-panel > .evidence-list:last-child .evidence-item:last-child { border-bottom: 0; }
.desk-panel summary { cursor: pointer; color: var(--accent); padding: 8px 13px; font-size: 12px; }
.evidence-panel details[open] > summary { border-bottom: 1px solid var(--border); }
.panel-empty { padding: 5px 13px; color: var(--text-muted); }
.archive-detail .inspector { border: 0; border-top: 1px solid var(--border); padding: 12px; margin: 0; }
.archive-detail .ins-head { display: block; }
.archive-detail .ins-score-box { text-align: left; margin-top: 12px; }
.archive-detail .grid-3 { grid-template-columns: repeat(2,minmax(0,1fr)); }
.factor-body, .validation-body { padding: 10px 13px; }
.factor-total { display: flex; align-items: baseline; gap: 5px; font: 11px var(--mono); color: var(--text-muted); margin: 0 0 7px; }
.factor-total strong { font-size: 31px; line-height: 1; color: var(--text); }
.factor-row { margin: 0 0 5px; }
.factor-row div { display: flex; justify-content: space-between; color: var(--text-secondary); font-size: 11.5px; }
.factor-row div span:last-child { font: 11.5px/1.6 var(--mono); }
.factor-row meter { appearance: none; display: block; height: 4px; width: 100%; margin: 2px 0 0; }
.factor-row meter::-webkit-meter-bar { border: 0; background: #27394c; border-radius: 5px; }
.factor-row meter::-webkit-meter-optimum-value { background: var(--accent); border-radius: 5px; }
.factor-row meter::-moz-meter-bar { background: var(--accent); border-radius: 5px; }
.quiet-note { display: block; margin: 7px 0 0; color: var(--text-muted); font-size: 11.5px; }
.validation-body .section-kicker { font: 600 11.5px/1.6 system-ui, sans-serif; letter-spacing: 0; margin-bottom: 3px; }
.validation-body p { font-size: 12.5px; }
.validation-question { margin-bottom: 9px; }
.validation-body details { border-top: 1px solid var(--border); margin-top: 8px; }
.validation-body summary { padding: 8px 0 1px; }
.validation-form { display: grid; gap: 7px; padding-top: 7px; }
.validation-form label { font-size: 12px; color: var(--text-secondary); }
.validation-form textarea { display: block; resize: vertical; }
.validation-form button { justify-self: start; }
#validationMessage:empty { display: none; }
#validationMessage { color: var(--pos); }
.matrix-panel .table-wrap { margin: 0; border: 0; border-radius: 0 0 8px 8px; }
.archive-panel { margin-bottom: 14px; }
.matrix-panel td:not(:nth-child(2)), .matrix-panel th { white-space: nowrap; }
.matrix-table .matrix-total { color: var(--accent); font-weight: 650; }
.matrix-link { font: inherit; color: var(--text); border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; }
.matrix-link:hover { text-decoration: underline; }
.matrix-link small { display: block; color: var(--text-muted); }
.table-wrap { overflow-x: auto; }
.signal-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.signal-controls input { max-width: 380px; }
.signal-controls select { max-width: 208px; }
.signal-controls output, .source-link { color: var(--text-muted); font-size: 12px; }
.source-link { display: inline-block; margin-top: 5px; }
#tab-signals table { min-width: 790px; }
#tab-signals td:nth-child(4) { overflow-wrap: anywhere; }
.modal-mask { position: fixed; inset: 0; border: 0; margin: auto; color: var(--text); background: transparent; width: min(100%, 760px); max-height: 100%; max-width: 100%; }
.modal-mask[open] { display: block; }
.modal-mask::backdrop { background: rgba(0,0,0,.72); }
.modal { margin: 0 auto; overflow-wrap: anywhere; }
.modal-links { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: 12px; }
#mHint { margin-right: 12px; }
#mLink { flex: none; }
@media (max-width: 1100px) {
  .research-desk { grid-template-columns: minmax(186px, .9fr) minmax(0, 3.5fr); }
}
@media (max-width: 950px) {
  .research-selection { grid-template-columns: minmax(0, 1fr); }
  .research-main, .research-context { display: contents; }
  .project-brief { order: -3; }
  .validation-panel { order: -2; }
  .evidence-panel { order: -1; }
  .archive-detail { order: 1; }
}
@media (max-width: 640px) {
  .topbar { align-items: start; flex-direction: column; }
  .meta-right { gap: 8px 12px; }
  .brand-caption { display: none; }
  .subbar { margin-bottom: 14px; }
  .nav-btn { font-size: 12px; padding: 7px 6px; min-height: 36px; }
  .research-stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .research-stats > div { padding: 8px; }
  .research-stats strong { font-size: 18px; }
  .research-desk { grid-template-columns: minmax(0, 1fr); }
  #watchList { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(146px, 44%); overflow-x: auto; padding-bottom: 8px; }
  .watch-item { min-height: 44px; }
  .watch-label small { font-size: 10.5px; }
  .watch-item { grid-template-columns: 15px minmax(0,1fr) 18px; gap: 3px; }
  .grid-2, .grid-3, .archive-detail .grid-3 { grid-template-columns: minmax(0,1fr); }
  .grid-2 > [style*="grid-column"] { grid-column: auto !important; }
  .inspector { padding: 14px; }
}

.roadmap-title { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.roadmap-title .sec-label { margin-bottom: 0; }
.roadmap-title a { text-decoration: none; }

</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 12l7-7"/></svg></span>
      <h1>Market Radar</h1>
      <span class="brand-caption">市场机会研究</span>
    </div>
    <div class="meta-right">
      <span>更新于 <b id="lblUpdated"></b></span>
      <span>归档批次 <b id="lblBatches"></b></span>
    </div>
  </header>

  <div class="subbar">
    <nav class="nav" aria-label="主导航">
      <button class="nav-btn active" aria-current="page" onclick="switchTab('tab-projects', this)">研究工作台</button>
      <button class="nav-btn" onclick="switchTab('tab-signals', this)">信号库 <span id="lblSigCnt">0</span></button>
      <button class="nav-btn" onclick="switchTab('tab-submit', this)">录入方向</button>
      <button class="nav-btn" onclick="switchTab('tab-whitepaper', this)">数据方法</button>
      <button class="nav-btn" onclick="switchTab('tab-roadmap', this)">归档与演进</button>
    </nav>
  </div>

  <div id="tab-projects"></div>
  <div id="tab-signals" style="display:none;"></div>
  <div id="tab-submit" style="display:none;"></div>
  <div id="tab-whitepaper" style="display:none;"></div>
  <div id="tab-roadmap" style="display:none;"></div>
</div>

<dialog class="modal-mask" id="snapModal" aria-labelledby="mTitle" onclick="if(event.target===this)this.close()">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
      <strong id="mTitle" style="font-size:15px;">证据快照</strong>
      <form method="dialog"><button class="btn">关闭</button></form>
    </div>
    <div id="mMeta" style="font-size:12px;color:var(--text-muted);margin-top:6px;"></div>
    <div class="modal-pre" id="mBody"></div>
    <div class="modal-links">
      <span id="mHint" style="color:var(--text-muted);"></span>
      <a id="mLink" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:none;"></a>
    </div>
  </div>

function cleanText(s) {
  if (!s) return '';
  // Strip decorative emojis for a clean, institutional terminal look
  return String(s).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '').replace(/\s+/g, ' ').trim();
}

function esc(s) {
  return cleanText(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getAllProjects() {
  let local = [];
  try { local = JSON.parse(localStorage.getItem('mr_custom_ideas') || '[]'); } catch(e) {}
  const merged = new Map((DATA.projects || []).map(p => [p.code, p]));
  if (Array.isArray(local)) local.forEach(p => { if (p?.code && !merged.has(p.code)) merged.set(p.code, p); });
  const all = [...merged.values()];
  all.sort((a,b) => (b.score || 0) - (a.score || 0));
  return all;
}

function submitNewIdea() {
  const title = document.getElementById('fTitle').value.trim();
  const proposer = document.getElementById('fProposer').value.trim() || '团队成员';
  const what = document.getElementById('fWhat').value.trim();
  const buyer = document.getElementById('fBuyer').value.trim() || '待定定价';
  const channel = document.getElementById('fChannel').value.trim() || '人脉私域';
  const evidence = document.getElementById('fEvidence').value.trim() || '人脉一线反馈';
  const days = parseInt(document.getElementById('fDays').value, 10);
  const paid = document.getElementById('fPaid').value === '1';
  if (!title || !what) { alert('请填写方向名称与产品定义'); return; }

  const sPay = paid ? 36 : 24;
  const sAcq = /(群|人脉|老客|小红书|闲鱼|评论)/.test(channel) ? 22 : 16;
  const sDel = days <= 7 ? 14 : (days <= 14 ? 11 : 7);
  const sComp = 8;
  const sVal = paid ? 9 : 6;
  const total = sPay + sAcq + sDel + sComp + sVal;

  const newObj = {
    code: 'TEAM-' + Date.now().toString().slice(-4),
    category_tag: `团队人脉提报 · ${proposer}`,
    title: `【人脉提报】${title}`,
    score: total,
    score_detail: `付费意愿 ${sPay}/40 · 获客截流 ${sAcq}/25 · 研发交付 ${sDel}/15 · 竞争缝隙 ${sComp}/10 · 48h测款 ${sVal}/10`,
    plain_what_to_do: what,
    workflow_steps: [`输入与痛点：${evidence}`, `处理逻辑：${days}天内基于现有脚本搭建最小闭环`, `交付变现：通过 ${channel} 按 ${buyer} 收款`],
    who_pays_and_price: buyer,
    ai_sharp_review: paid ? '人脉痛点明确且有付费意愿，重点验证能否从单点熟人复制至公域标准品。' : '当前仅口头意向，必须先收定金验证真伪。',
    plan_48h: `48小时内由 ${proposer} 向客户发去半自动样品 Demo 并收取 99~299 元测试定金。`,
    compounding: { tier: "垂直工具沉淀", snowball: "从熟人定制切入，提炼通用行业规则后转为按月订阅制工具。", skill_gain: "沉淀垂直行业工作流与自动化交付能力。" },
    biz_eval: { cost: "初期成本 <100元", profit: `按 ${buyer} 测算，毛利率 90%+`, time: `MVP ${days} 天`, team: "1.5人", landing: "熟人首单验证 -> 半自动脚本 -> 标准化SaaS", compliance: "注意数据脱敏与平台合规" },
    evidence_ids: []
  };

  let local = [];
  try { local = JSON.parse(localStorage.getItem('mr_custom_ideas') || '[]'); } catch(e) {}
  if (!Array.isArray(local)) local = [];
  local.unshift(newObj);
  try {
    localStorage.setItem('mr_custom_ideas', JSON.stringify(local));
  } catch {
    document.getElementById('submitMsg').textContent = '当前浏览器无法保存，请保留填写内容。';
    return;
  }
  selectedCode = newObj.code;
  workMode = 'focus';
  renderProjects();
  document.getElementById('submitMsg').innerText = `已生成规则评分（${total}/100），方向已加到本机工作台。`;
  document.getElementById('cliBox').style.display = 'block';
  document.getElementById('cliCmd').innerText =
    `python3 scripts/radar_cli.py submit-idea --title "${title}" --proposer "${proposer}" --what "${what}" --buyer "${buyer}" --evidence "${evidence}" --channel "${channel}" --mvp-days ${days}` + (paid ? '' : ' --unpaid') + ` && python3 scripts/sync_github.py`;
}

function sourceLink(value) {
  try {
    const url = new URL(value);
    if (!['http:', 'https:'].includes(url.protocol)) return null;
    const home = url.pathname === '/' && !url.search && !url.hash;
    const listing = url.hostname === 'apps.apple.com';
    return {url: url.href, label: home ? '平台首页' : listing ? '应用商店页面' : '来源链接',
      hint: home ? '采集记录仅保留了平台首页，无法直接核对这条内容。' :
        listing ? '应用页面不一定能定位到该条评论。' : '外部页面可访问性由来源平台决定。'};
  } catch { return null; }
}

function openSnap(id) {
  const s = SIG_MAP[id];
  if (!s) return;
  document.getElementById('mTitle').textContent = `证据 #${s.id} — ${cleanText(s.title)}`;
  document.getElementById('mMeta').textContent = `${evidenceKind(s)} · ${cleanText(s.channel)} · ${cleanText(s.author_or_app)} · ${cleanText(s.collected_at)}`;
  document.getElementById('mBody').textContent = [
    s.is_noise ? `已过滤：${cleanText(s.noise_reason) || '未记录原因'}` : '',
    '[采集时保存的内容]',
    String(s.content || '').trim(),
    '',
    '[指标与分类]',
    [s.metric_primary, s.metric_secondary, s.rating_or_price].filter(Boolean).map(cleanText).join(' · '),
    [s.category, s.query_term, s.pain_tags].filter(Boolean).map(cleanText).join(' · '),
  ].filter((line, i) => i !== 0 || line).join('\n');
  const source = sourceLink(s.source_url);
  const link = document.getElementById('mLink');
  link.hidden = !source;
  if (source) {
    link.href = source.url;
    link.textContent = source.label + ' ↗';
  } else link.removeAttribute('href');
  document.getElementById('mHint').textContent = source?.hint || '当前记录没有可用的原站链接。';
  document.getElementById('snapModal').showModal();
}

function switchTab(id, btn) {
  ['tab-projects','tab-signals','tab-submit','tab-whitepaper','tab-roadmap'].forEach(t => {
    document.getElementById(t).style.display = (t === id) ? 'block' : 'none';
  });
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b === btn);
    if (b === btn) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
}

function filterRows() {
  const q = document.getElementById('qInput').value.trim().toLowerCase();
  const id = q.match(/^#(\d+)$/)?.[1];
  const ch = document.getElementById('chSelect').value;
  const noise = document.getElementById('noiseSelect').value;
  let count = 0;
  document.querySelectorAll('.sig-row').forEach(r => {
    const match = (!q || (id ? r.dataset.q.split(' ')[0] === id : r.dataset.q.toLowerCase().includes(q)))
      && (!ch || r.dataset.ch === ch)
      && (noise === 'all' || r.dataset.noise === (noise === 'noise' ? '1' : '0'));
    r.hidden = !match;
    if (match) count++;
  });
  document.getElementById('signalCount').textContent = `显示 ${count} 条`;
}

<script>
const SHORT_TITLES = {

  'PROJ-04': '离线提词与视频粗剪',

const RESEARCH_QUESTIONS = {
  'AUTO-01': '带货创作者是否愿意为批量出图付费？',
  'PROJ-01': '收藏教程、遇到配置困难的人，是否愿意为成片付费？',

  'PROJ-03': '先验证哪类客户会付款：备考用户，还是需要续费沟通的教培机构？',
  'AUTO-03': '门窗商家是否会用快速报价替代现有流程，并为此付费？',
  'PROJ-04': '对扣费和操作不满的用户，是否愿意为离线买断版付费？',
  'PROJ-05': '直播创作者是否愿意为互动效果和低运行成本付费？',
};
const FACTORS = [
  ['付费意愿', '付费意愿'], ['获客截流', '获客渠道'], ['研发交付', '研发交付'],
  ['竞争缝隙', '竞争空间'], ['48h测款', '快速验证'],
];
const STAGES = [
  ['planned', '待验证'], ['running', '验证中'], ['pass', '已达到条件'],
  ['fail', '未达到条件'], ['unclear', '结果不充分'],
];
const VALIDATION_KEY = 'mr_validation_v1';

let selectedCode = '';
let workMode = 'focus';
let savedReports = readReports();

function readReports() {
  try {
    const data = JSON.parse(localStorage.getItem(VALIDATION_KEY) || '{}');
    return data && typeof data === 'object' && !Array.isArray(data) ? data : {};
  } catch { return {}; }
}

function shortTitle(p) {
  return SHORT_TITLES[p.code] || cleanText(p.title).replace(/^(?:【[^】]+】|项目\s*\d+[：:])\s*/, '');
}

function evidenceFor(p) {
  return [...new Set(p.evidence_ids || [])].map(id => SIG_MAP[id]).filter(Boolean);
}

function sourceLabel(p) {
  return cleanText(p.category_tag).split('·')[0].trim() || '来源未标注';
}

function factorValues(p) {
  const detail = cleanText(p.score_detail);
  return FACTORS.map(([source, label]) => {
    const m = detail.match(new RegExp(source + '\\s*(\\d+)\\s*/\\s*(\\d+)'));
    if (!m || +m[2] <= 0 || +m[1] > +m[2]) return { label };
    return { label, score: +m[1], max: +m[2] };
  });
}

function stageName(key) {
  return STAGES.find(([id]) => id === key)?.[1] || STAGES[0][1];
}

function scoreText(p) {
  return Number.isFinite(p.score) ? String(p.score) : '—';
}

function renderProjects() {
  const list = getAllProjects();

      </div>

      <div><span>已归档批次</span><strong>${archived}</strong><small>按采集批次归档</small></div>
    </div>
    ${list.length ? workMode === 'matrix' ? renderMatrix(list) : `
    <div class="research-desk">

        <div class="panel-head"><h3>候选列表</h3><span class="panel-count">${list.length}</span></div>

  `;
  if (list.length && workMode === 'focus') updateSelection(list);
}

function renderWatchlist(list) {
  return list.map((p, i) => `
    <button type="button" class="watch-item" data-rank="${i}" aria-pressed="${p.code === selectedCode}" onclick="selectProject(${i})">
      <span class="watch-rank">${String(i+1).padStart(2, '0')}</span>
      <span class="watch-label"><strong>${esc(shortTitle(p))}</strong><small>${esc(stageName(savedReports[p.code]?.stage))} · ${evidenceFor(p).length} 条关联</small></span>
      <span class="watch-score">${scoreText(p)}</span>
    </button>`).join('');
}

function updateSelection(list) {
  const watch = document.getElementById('watchList');
  if (!watch.children.length) watch.innerHTML = renderWatchlist(list);
  for (const item of watch.children) {
    item.setAttribute('aria-pressed', String(list[Number(item.dataset.rank)]?.code === selectedCode));
  }
  const index = list.findIndex(p => p.code === selectedCode);
  const p = list[index];
  if (!p) return;
  document.getElementById('researchSelection').innerHTML = `
    <div class="research-main">
      <section class="desk-panel project-brief" aria-labelledby="activeProject">
        <div class="brief-eyebrow"><span class="asset-code">${esc(p.code)}</span><span>${esc(sourceLabel(p))}</span></div>
        <h3 id="activeProject">${esc(shortTitle(p))}</h3>
        <p class="brief-lead">${esc(p.plain_what_to_do) || '暂无产品定位。'}</p>
        ${p.who_pays_and_price ? `<div class="brief-buyer"><span>客群与定价假设</span><p>${esc(p.who_pays_and_price)}</p></div>` : ''}
      </section>
      ${renderLinkedEvidence(p)}
      <details class="desk-panel archive-detail">
        <summary>展开完整评估档案</summary>
        ${renderDetailCard(p, index)}
      </details>
    </div>
    <aside class="research-context">
      ${renderFactors(p)}
      ${renderValidation(p)}
    </aside>`;
}

function selectProject(index) {
  const list = getAllProjects();
  if (!list[index]) return;
  selectedCode = list[index].code;
  if (workMode !== 'focus') {
    workMode = 'focus';
    renderProjects();
    const active = document.querySelector('.watch-item[aria-pressed=true]');
    active?.focus({preventScroll: true});
    document.getElementById('tab-projects').scrollIntoView({block: 'start'});
  } else {
    updateSelection(list);
    document.querySelector('.watch-item[aria-pressed=true]')?.focus({preventScroll: true});
  }
}

function setWorkMode(mode) {
  if (mode === workMode) return;
  workMode = mode;
  renderProjects();
  document.getElementById(mode === 'focus' ? 'focusMode' : 'matrixMode')?.focus();
}

function renderFactors(p) {
  const rules = p.code?.startsWith('TEAM-') ? '团队提报评分' : '评估模型评分';
  return `
    <section class="desk-panel" aria-label="立项评分">
      <div class="panel-head"><h3>五维评分</h3><span class="panel-count">${rules}</span></div>
      <div class="factor-body">
        <div class="factor-total"><strong>${scoreText(p)}</strong><span> / 100</span></div>
        ${factorValues(p).map(({label, score, max}) => `
          <div class="factor-row">
            <div><span>${label}</span><span>${max ? score + '/' + max : '未记录'}</span></div>
            ${max ? `<meter min="0" max="${max}" value="${score}" aria-label="${label}"></meter>` : ''}
          </div>`).join('')}
        <p class="quiet-note">评分用于比较方向；不代表付费已验证。</p>
      </div>
    </section>`;
}

function renderMatrix(list) {
  return `
    <section class="desk-panel matrix-panel">
      <div class="panel-head"><h3>候选方向比较</h3><span class="panel-count">按评估分排序 · 分项显示得分 / 满分</span></div>
      <div class="table-wrap" role="region" aria-label="五维评分对照表" tabindex="0">
        <table class="matrix-table">
          <thead><tr><th>排名</th><th>候选方向</th><th>总分</th>${FACTORS.map(([,label]) => `<th>${label}</th>`).join('')}<th>可查证据</th><th>验证状态</th></tr></thead>
          <tbody>${list.map((p,i) => `
          <tr>
            <td class="mono">${String(i+1).padStart(2,'0')}</td>
            <td><button type="button" class="matrix-link" onclick="selectProject(${i})">${esc(shortTitle(p))}<small>${esc(sourceLabel(p))}</small></button></td>
            <td class="matrix-total mono">${scoreText(p)}</td>
            ${factorValues(p).map(x => `<td class="mono">${x.max ? x.score + '/' + x.max : '—'}</td>`).join('')}
            <td class="mono">${evidenceFor(p).filter(s => !s.is_noise).length}</td>
            <td>${esc(stageName(savedReports[p.code]?.stage))}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </section>`;
}

function evidenceKind(s) {
  if (/导表/.test(s.source_tier + ' ' + s.channel)) return '导入记录';
  if (/AppStore/i.test(s.channel)) return '用户差评';
  if (/B站/.test(s.channel)) return '视频与评论';
  if (/微信/.test(s.channel)) return '公开文章摘要';
  if (/V2EX/i.test(s.channel)) return '社区讨论';
  return '采集记录';
}

function renderLinkedEvidence(p) {
  const evidence = evidenceFor(p);
  const missing = new Set(p.evidence_ids || []).size - evidence.length;
  const active = evidence.filter(s => !s.is_noise);
  const kinds = new Set(active.map(s => s.channel).filter(Boolean));
  const rows = evidence.map(s => `
    <button type="button" class="evidence-item" onclick="openSnap(${Number(s.id)})">
      <span class="evidence-meta">#${Number(s.id)} · ${esc(evidenceKind(s))}${s.is_noise ? ' · 已过滤' : ''}</span>
      <strong>${esc(s.title)}</strong>
      <small>${[s.author_or_app, s.metric_primary].filter(Boolean).map(esc).join(' · ')}</small>
      <span class="evidence-arrow" aria-hidden="true">↗</span>
    </button>`);
  return `
    <section class="desk-panel evidence-panel">
      <div class="panel-head"><h3>关联市场信号</h3><span class="panel-count">${active.length} 条有效 · ${kinds.size} 个渠道</span></div>
      ${evidence.length ? `
        <div class="evidence-list">${rows.slice(0,3).join('')}</div>
        ${rows.length > 3 ? `<details><summary>查看其余 ${rows.length - 3} 条关联</summary><div class="evidence-list">${rows.slice(3).join('')}</div></details>` : ''}
      ` : '<p class="panel-empty">暂无可打开的关联快照。提报描述和评分不能替代来源记录。</p>'}
      ${missing ? `<p class="panel-empty">${missing} 条引用未找到当前批次快照。</p>` : ''}
    </section>`;
}

function renderValidation(p) {
  const report = savedReports[p.code] || {};
  return `
    <section class="desk-panel validation-panel">
      <div class="panel-head"><h3>48 小时验证</h3><span class="panel-count" id="validationStage">${stageName(report.stage)}</span></div>
      <div class="validation-body">
        ${RESEARCH_QUESTIONS[p.code] ? `<div class="validation-question"><span class="section-kicker">待验证问题</span><p>${esc(RESEARCH_QUESTIONS[p.code])}</p></div>` : ''}
        <span class="section-kicker">建议动作</span>
        <p>${esc(p.plan_48h) || '暂无验证建议。'}</p>
        <details id="validationRecord">
          <summary>${report.updated ? '查看 / 更新验证记录' : '记录通过条件与实际结果'}</summary>
          <form class="validation-form" onsubmit="saveValidation(event)">
            <label>验证状态<select id="validationStatus">${STAGES.map(([key,label]) => `<option value="${key}" ${report.stage === key ? 'selected' : ''}>${label}</option>`).join('')}</select></label>
            <label>通过条件<textarea id="validationCriterion" rows="2" maxlength="600" placeholder="例如：联系 10 位目标客户，至少 2 位支付定金">${escapeFormValue(report.criterion)}</textarea></label>
            <label>实际结果<textarea id="validationResult" rows="2" maxlength="1200" placeholder="记录触达、询价、付定金人数，以及观察到的阻碍">${escapeFormValue(report.result)}</textarea></label>
            <button class="btn btn-primary" type="submit">保存记录</button>
            <small class="quiet-note">仅保存在当前浏览器。${report.updated ? ' 上次保存于 ' + esc(report.updated) + '。' : ''}</small>
            <p id="validationMessage" role="status"></p>
          </form>
        </details>
      </div>
    </section>`;
}

function escapeFormValue(value) {
  return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function saveValidation(event) {
  event.preventDefault();
  const stage = document.getElementById('validationStatus').value;
  const criterion = document.getElementById('validationCriterion').value.trim();
  const result = document.getElementById('validationResult').value.trim();
  const message = document.getElementById('validationMessage');
  if (['pass', 'fail'].includes(stage) && (!criterion || !result)) {
    message.textContent = '请填写通过条件和实际结果，再记录结论。';
    return;
  }
  const time = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai', dateStyle: 'short', timeStyle: 'short',
  }).format(new Date());
  const next = {...savedReports};
  if (stage === 'planned' && !criterion && !result) delete next[selectedCode];
  else next[selectedCode] = {stage, criterion, result, updated: time};
  try {
    localStorage.setItem(VALIDATION_KEY, JSON.stringify(next));
  } catch {
    message.textContent = '当前浏览器无法保存记录，请保留填写内容。';
    return;
  }
  savedReports = next;
  const watch = document.getElementById('watchList');
  const scroll = watch.scrollLeft;
  watch.innerHTML = renderWatchlist(getAllProjects());
  watch.scrollLeft = scroll;
  document.getElementById('validationStage').textContent = stageName(stage);
  const exists = Boolean(next[selectedCode]);
  event.currentTarget.querySelector('.quiet-note').textContent = '仅保存在当前浏览器。' + (exists ? '上次保存于 ' + time + '。' : '');
  document.querySelector('#validationRecord summary').textContent = exists ? '查看 / 更新验证记录' : '记录通过条件与实际结果';
  message.textContent = exists ? '验证记录已保存。' : '已恢复为待验证。';
}

</script>
</body>
</html>
