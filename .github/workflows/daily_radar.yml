name: Daily Market Radar Routine Update

on:
  schedule:
    # 每天北京时间 08:30 (UTC 00:30) 自动执行增量采集、去重归档与看板发布
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run incremental collection, cleaning, archive and dashboard build
        run: python3 run_radar.py run-all

      - name: Commit and push incremental JSONL, archive and updated dashboard
        run: |
          git config user.name "market-radar-bot"
          git config user.email "bot@market-radar.local"
          git add data/ docs/ index.html exports/
          git diff --staged --quiet || git commit -m "chore(routine): daily incremental market signals and dashboard update"
          git push
